name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy==2.4.6" "soundfile==0.14.0" "Pillow==12.3.0" "mutagen==1.48.1"
      - name: Validate Codex and Claude portability
        run: python scripts/validate_portability.py
      - name: Install Claude Code validator
        if: runner.os == 'Linux'
        run: npm install --global @anthropic-ai/claude-code@2.1.233
      - name: Validate Claude plugin package
        if: runner.os == 'Linux'
        run: claude plugin validate . --strict
      - name: Run guitar workflow tests
        run: python skills/create-guitar-karaoke/scripts/test_build_guitar_karaoke.py
      - name: Run karaoke helper tests
        run: python skills/create-karaoke-video/scripts/test_create_karaoke_video.py
      - name: Run deal memory tests
        run: python skills/deal-watch-alerts/scripts/test_deal_memory.py
      - name: Run travel ranking tests
        run: python skills/travel-deal-finder/scripts/test_rank_offers.py
      - name: Run LinkedIn extraction tests
        run: node skills/linkedin-knowledge-digest/scripts/test_linkedin_candidates.js
      - name: Run LinkedIn scan orchestrator tests
        run: node skills/linkedin-knowledge-digest/scripts/test_linkedin_scan_orchestrator.js
      - name: Scan export safety
        run: python scripts/safety_scan.py
      - name: Validate plugin JSON
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json'))"
